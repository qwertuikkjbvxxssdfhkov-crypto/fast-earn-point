<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Earn Point</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 25px;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .balance {
      background: white;
      margin: 25px 15px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px #ddd;
    }

    .points {
      font-size: 35px;
      font-weight: bold;
      color: #2563eb;
    }

    button {
      width: 90%;
      padding: 15px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .card {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 10px #ddd;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>⚡ Fast Earn Point</h1>
    <p>Earn Points & Get Rewards</p>
  </div>

  <div class="balance">
    <p>Your Points</p>
    <div class="points" id="points">0</div>
    <button onclick="earnPoint()">🎁 Earn Point</button>
  </div>

  <div class="card">
    <h2>💰 Wallet</h2>
    <button onclick="alert('Wallet coming soon')">Open Wallet</button>
  </div>

  <div class="card">
    <h2>👥 Referral</h2>
    <button onclick="alert('Referral system coming soon')">Invite Friends</button>
  </div>

  <div class="card">
    <h2>💸 Withdraw</h2>
    <button onclick="alert('Withdrawal system coming soon')">Withdraw Points</button>
  </div>

  <script>
    let points = 0;

    function earnPoint() {
      points++;
      document.getElementById("points").innerText = points;
    }
  </script>

</body>
</html>
